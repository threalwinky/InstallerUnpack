[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "installerunpack"
version = "0.1.0"
description = "Offline extraction for supported InstallAnywhere and InstallShield installers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving",
]

[project.scripts]
installerunpack = "installerunpack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
installerunpack = ["resources/*.java"]
